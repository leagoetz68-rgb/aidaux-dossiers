<style>
:root{
  --navy:#1B2A6B;--teal:#13B3B3;--coral:#E8583A;
  --bg:#F3F6FB;--card:#FFFFFF;--ink:#1B2A6B;--ink2:#56607F;--line:#DDE3EF;
  --ok:#22855A;--ok-soft:#E2F4EA;--warn:#B8650F;--warn-soft:#FDEFDC;
  --bad:#C93434;--bad-soft:#FDE6E6;--rdv:#6A4BC9;--rdv-soft:#EEE8FB;
  --teal-ink:#0B7A7A;--teal-soft:#DFF5F5;--gray-soft:#EEF1F6;--coral-soft:#FDE9E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1630;--card:#18214A;--ink:#EEF1FB;--ink2:#A7B0D0;--line:#2A3566;
  --ok:#5FD39A;--ok-soft:#173A31;--warn:#F2B15F;--warn-soft:#3D2E17;
  --bad:#F28585;--bad-soft:#40202A;--rdv:#B9A5F5;--rdv-soft:#2C2556;
  --teal-ink:#5FE0E0;--teal-soft:#123A45;--gray-soft:#222C5A;--coral-soft:#3E2526;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1630;--card:#18214A;--ink:#EEF1FB;--ink2:#A7B0D0;--line:#2A3566;
  --ok:#5FD39A;--ok-soft:#173A31;--warn:#F2B15F;--warn-soft:#3D2E17;
  --bad:#F28585;--bad-soft:#40202A;--rdv:#B9A5F5;--rdv-soft:#2C2556;
  --teal-ink:#5FE0E0;--teal-soft:#123A45;--gray-soft:#222C5A;--coral-soft:#3E2526;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:700;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.appbar{background:linear-gradient(120deg,#1B2A6B 0%,#000F9F 100%);color:#fff;padding:18px 0 4px}
.appbar .inner,.wrap{max-width:1440px;margin:0 auto;padding-left:28px;padding-right:28px}
.wrap{padding-top:20px;padding-bottom:60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--navy);font-family:"Baloo 2",sans-serif;font-weight:700;font-size:20px}
.logo span{color:var(--teal)}
.top h1{font-size:26px;color:#fff}
.top p{margin:0;color:#C9D1F2;font-size:14px}
.who-me{color:#C9D1F2;font-size:13px}
.appbar .ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.appbar .ghost:hover{border-color:#fff}
.logoimg{background:#fff;border-radius:12px;padding:3px}
.top .grow{flex:1}
.logoimg{height:46px;width:auto}
a.ghost{text-decoration:none}
.dates select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}
.btn:disabled{opacity:.6}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--ink2);font-size:13px}
.ghost:hover{border-color:var(--ink2)}

.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.gauge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;color:#fff}
.gauge svg{flex:none}
.gauge h3{font-size:18px}
.gauge p{margin:2px 0 0;color:#C9D1F2;font-size:13px}
.gauge.total{background:rgba(19,179,179,.18);border-color:rgba(19,179,179,.5);color:#fff}
.gauge.total p{color:#C9D1F2}
.bignum{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:40px;min-width:72px;text-align:center;line-height:1}

.feed{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;scrollbar-width:thin}
.news{flex:none;max-width:300px;background:rgba(255,255,255,.08);color:#fff;border:none;border-left:4px solid var(--teal);border-radius:0;padding:9px 12px;font-size:13px}
.news.coral{border-left-color:var(--coral)}
.news small{display:block;color:#C9D1F2;font-size:12px}

.bar-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tab{border:none;background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;color:var(--ink2);border:1px solid var(--line)}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--coral);color:#fff;font-size:12px;margin-left:6px}
.spacer{flex:1}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;width:100%;transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:var(--teal)}
.who{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--teal-soft);color:var(--teal-ink)}
.av.v{background:var(--coral-soft);color:var(--coral)}
.who b{display:block;font-size:16px}
.who span{color:var(--ink2);font-size:13px}
.prog{height:10px;border-radius:99px;background:var(--gray-soft);overflow:hidden;display:flex;margin:14px 0 6px}
.prog i{display:block;height:100%;transition:width .4s}
.prog .pv{background:var(--ok)}.prog .pr{background:var(--teal)}
.progtxt{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.progtxt b{color:var(--ink)}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:4px}

.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.row-main{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.row-main .who{min-width:220px;flex:1}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:none;border-radius:12px;padding:6px 10px;font-size:12.5px;text-align:left;line-height:1.25;min-width:118px}
.pill small{display:block;font-size:11.5px;opacity:.85}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-warn{background:var(--warn-soft);color:var(--warn)}
.st-bad{background:var(--bad-soft);color:var(--bad)}
.st-rdv{background:var(--rdv-soft);color:var(--rdv)}
.st-vide{background:var(--gray-soft);color:var(--ink2)}
.pill.open{outline:2px solid currentColor}
.editor{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.editor label{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink2);gap:4px}
.editor input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card)}
.btn{border:none;border-radius:10px;padding:8px 14px;font-weight:700;background:var(--navy);color:#fff}
.btn.teal{background:var(--teal);color:#06302F}
a.btn{text-decoration:none;display:inline-block}
.btn.light{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.verif-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px}
.verif-box.on{border-style:solid;border-color:var(--warn);background:var(--warn-soft)}
.verif-info{font-size:12.5px;color:var(--ink2)}
.rel-list{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.rel-l{display:grid;grid-template-columns:90px 120px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.rel-d{font-weight:600}.rel-c{color:var(--ink2)}
.rel-add{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-top:6px}
.rel-add label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.rel-add input,.rel-add select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);font:inherit;color:var(--ink)}
.rel-grow{flex:1;min-width:200px}
@media(max-width:600px){.rel-l{grid-template-columns:80px 1fr auto}.rel-c{grid-column:1/-1;order:5}}
.note{font-size:12.5px;color:var(--ink2);margin:10px 0 0}

.detail{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{font-size:24px}
.sec{margin-top:22px}
.sec h3{font-size:18px;color:var(--coral);margin-bottom:8px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:8px 0 0}
.doc{display:grid;grid-template-columns:minmax(150px,1.2fr) auto minmax(140px,1.4fr);gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.doc .lab{font-weight:600}
.doc .lab select{margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--card);font-size:13px;font-weight:400}
.sbtns{display:flex;gap:6px}
.sbtn{border:none;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;min-width:96px}
.nc{border:1px solid var(--line);background:none;border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink2)}
.nc[aria-pressed="true"]{background:var(--gray-soft);color:var(--ink);text-decoration:line-through}
.st-manquant{background:var(--gray-soft);color:var(--ink2)}
.st-recu{background:var(--teal-soft);color:var(--teal-ink)}
.st-verifie{background:var(--ok-soft);color:var(--ok)}
.st-nc{background:var(--gray-soft);color:var(--ink2);text-decoration:line-through}
.doc input.com{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--bg);font-size:13px;width:100%}
.sub{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
.tick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;background:none}
.tick[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dates{display:flex;flex-wrap:wrap;gap:14px}
.dates label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.dates input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:transform .35s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .doc{grid-template-columns:1fr}
}

/* ---- deux colonnes ---- */
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
.col-list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.li-search{padding:4px 4px 8px}
.li-search input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
.cat-badge{display:inline-block;vertical-align:middle;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;margin-left:4px}
.cat-badge.administratif{background:#EDE7FF;color:#5B3FB8}
.mail-box{max-width:820px;max-height:92vh}
.mail-f{display:flex;flex-direction:column;gap:8px;padding:14px 18px 0;overflow:auto;min-height:0}
.mail-f>*{flex-shrink:0}
.mail-pied{position:sticky;bottom:0;background:var(--card);padding:10px 0 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.ico-mail{vertical-align:-3px;flex:none}
.rdv-h h3 .ico-mail{width:20px;height:20px;color:var(--teal-ink);margin-right:4px}
.li-mail{color:var(--ink2)}.li-mail:hover{color:var(--teal-ink)}
.mail-f label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.mail-f input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;font-weight:400;background:var(--bg);color:var(--ink)}
.mail-corps{border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-height:260px;height:auto;background:#fff;color:#222;font-family:Verdana,Arial,sans-serif;font-size:14px;line-height:1.45;outline:none}
.mail-corps:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.mail-corps p{margin:0 0 10px}.mail-corps ul{margin:0 0 10px;padding-left:26px}
.mail-warn{margin:0;font-size:13px;color:#B26A00}
.mail-btn{padding:4px 10px;font-size:12.5px;margin-top:6px}
.mx-lab{font-size:12.5px;color:var(--ink2);margin:10px 0 2px}
.cat-badge.mixte{background:linear-gradient(90deg,var(--teal-soft),#EDE7FF);color:#3B3F8F}
.cat-badge.terrain{background:var(--teal-soft);color:var(--teal-ink)}
.cat-switch{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cat-switch .chip{padding:4px 10px;font-size:12.5px}
.li-head{display:flex;gap:6px;flex-wrap:wrap;padding:4px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.li-wrap{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.li{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid transparent;background:none;border-radius:12px;padding:8px}
.li:hover{background:var(--bg)}
.li-row{display:flex;align-items:center;gap:2px}
.li-x{flex:none;width:28px;height:28px;border:none;background:none;border-radius:8px;color:var(--ink2);font-size:20px;line-height:1;cursor:pointer}
.li-x:hover{background:#fde2e2;color:#c62828}
.li-x.li-arch{font-size:15px}
.li-x.li-arch:hover{background:var(--bg);color:var(--ink)}
.tab .n.n-gris{background:var(--line);color:var(--ink2)}
.li.active{background:var(--teal-soft);border-color:var(--teal)}
.li .av{width:36px;height:36px;font-size:12.5px}
.li-t{flex:1;min-width:0}
.li-t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-t>span{color:var(--ink2);font-size:12px}
.li-m{display:flex;align-items:center;gap:8px;margin-top:3px}
.li-m small{color:var(--ink2);font-size:11.5px}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;display:block}
.dot.st-ok{background:var(--ok)}.dot.st-warn{background:var(--warn)}.dot.st-bad{background:var(--bad)}.dot.st-rdv{background:var(--rdv)}.dot.st-vide{background:var(--line)}.dot.st-nc{background:var(--gray-soft);border:1px solid var(--line)}
.mini{flex:1;height:5px;border-radius:9px;background:var(--gray-soft);overflow:hidden;max-width:90px}
.mini i{display:block;height:100%;background:var(--ok)}
.empty.small{padding:18px;font-size:13.5px;border-width:1px}
.back-m{display:none}
.dossier h4{font-size:14px;margin:18px 0 6px;color:var(--ink);font-family:Nunito,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.dossier h4 small{text-transform:none;font-weight:400;color:var(--ink2);letter-spacing:0}
.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(70px,auto) minmax(140px,1.6fr) 52px;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.trow:first-child{border-top:none}
.trow.thead{background:var(--bg);font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--ink2);padding:6px 10px}
.trow.thead .t-ver{color:var(--coral)}
.trow.is-ok{background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
.trow.is-nc .t-doc{text-decoration:line-through;color:var(--ink2)}
.t-doc{font-weight:600;font-size:14px}
.t-doc small{font-weight:400;color:var(--ink2)}
.t-pres,.t-ver{display:flex;justify-content:center}
.t-wide{grid-column:2 / -1}
.trow .com{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--bg);font-size:13px;width:100%}
.cmu{margin-top:4px;font-size:13px;font-weight:600}
.ptypes{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.cl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}
.cbx{position:relative;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;user-select:none}
.cbx input{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px}
.cbx .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink2);background:var(--card);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.cbx input:checked+.box{background:var(--ok);border-color:var(--ok)}
.cbx input:checked+.box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cbx input:focus-visible+.box{outline:3px solid var(--teal);outline-offset:2px}
.cbx input:disabled+.box{opacity:.35}
.t-ver .cbx input:checked+.box{background:var(--coral);border-color:var(--coral)}
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .col-list{position:static;max-height:none}
  .split.has-open .col-list{display:none}
  .back-m{display:inline-block}
  .trow{grid-template-columns:1fr auto;grid-template-areas:"doc pres" "com nc"}
  .t-doc{grid-area:doc}.t-pres{grid-area:pres}.t-ver{grid-area:ver}.t-com{grid-area:com}.t-nc{grid-area:nc}
  .trow.thead{display:none}
  .t-wide{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---- lignes dépliables ---- */
.acc-h{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;transition:box-shadow .2s,transform .1s}
.acc-h:hover{box-shadow:0 4px 16px rgba(27,42,107,.08)}
.acc-h:active{transform:scale(.995)}
.acc-h.open{border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.acc-ico{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--gray-soft);display:grid;place-items:center;flex:none}
.acc-t{flex:1;min-width:0}.acc-t b{display:block;font-size:16.5px;font-family:'Baloo 2',sans-serif}.acc-t small{color:var(--ink2);font-size:12.5px}
.acc-badge{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;padding:4px 12px;border-radius:99px}
.acc-badge.st-ok{background:var(--ok-soft);color:var(--ok)}.acc-badge.st-bad{background:var(--bad-soft);color:var(--bad)}
.acc-chev{font-size:24px;color:var(--ink2);transition:transform .25s;line-height:1}
.acc-h.open .acc-chev{transform:rotate(90deg)}
.acc-body{border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;padding:4px 14px 14px;animation:accIn .25s ease}
.acc-body .sec.dossier{margin-top:8px}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* ---- la vie du salarié ---- */
.vie-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.vcard{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s}
.vcard.wide{grid-column:1/-1}
.vcard.st-ok,.vcard.st-nc{border-left-color:var(--ok)}
.vcard.st-bad,.vcard.st-vide,.vcard.st-rdv,.vcard.st-warn{border-left-color:var(--bad)}
.vcard.vc-medecine.st-warn{border-left-color:#1F5FBF}
.vcard.flash{box-shadow:0 0 0 4px color-mix(in srgb,var(--ink2) 35%,transparent)}
.vcard header{display:flex;align-items:center;gap:8px}
.vcard h4{margin:0;font-size:15px;flex:1}
.v-ico{font-size:20px}
.v-st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.vcard.st-ok .v-st,.vcard.st-nc .v-st{background:var(--ok-soft);color:var(--ok)}
.vcard.st-bad .v-st,.vcard.st-vide .v-st,.vcard.st-rdv .v-st,.vcard.st-warn .v-st{background:var(--bad-soft);color:var(--bad)}
.vcard.vc-medecine.st-warn .v-st{background:#E3EEFB;color:#1F5FBF}
.v-body{display:flex;gap:14px;align-items:center}
.count{min-width:96px;text-align:center;padding:8px 6px;border-radius:12px}
.count b{display:block;font-family:'Baloo 2',sans-serif;font-size:30px;line-height:1}
.count small{font-size:11px}
.count.st-ok,.count.st-nc{background:var(--ok-soft);color:var(--ok)}
.count.st-bad,.count.st-vide,.count.st-rdv,.count.st-warn{background:var(--bad-soft);color:var(--bad)}
.vc-medecine .count.st-warn{background:#E3EEFB;color:#1F5FBF}
.v-fields{display:flex;flex-direction:column;gap:6px;flex:1}
.v-fields label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:2px}
.v-fields input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font:inherit;color:var(--ink)}
.rdvrow{display:flex;gap:4px}.rdvrow input{flex:1}
.v-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.v-com{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font:inherit;font-size:13px;resize:vertical;color:var(--ink)}
.x{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;font-size:18px;line-height:1;color:var(--ink2);cursor:pointer;flex:none}
.x:hover{color:var(--bad);border-color:var(--bad)}
.av-list{display:flex;flex-direction:column;gap:6px}
.av-l{display:grid;grid-template-columns:150px 1fr auto auto;gap:8px;align-items:center;padding:6px;border-radius:10px;background:var(--bad-soft)}
.av-l.is-ok{background:var(--ok-soft)}
.av-l input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);font:inherit;color:var(--ink)}
.av-l .com{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card);font-size:13px;width:100%}
.v-empty{color:var(--ink2);font-size:13px;margin:0}
.av-add{align-self:flex-start}
@media (max-width:600px){.av-l{grid-template-columns:1fr auto}.av-l .com{grid-column:1/-1}.v-body{flex-direction:column;align-items:stretch}}
@media (prefers-color-scheme:dark){.vcard.vc-medecine.st-warn .v-st,.vc-medecine .count.st-warn{background:#16294A;color:#8DB8F5}}
@media (prefers-reduced-motion:reduce){.acc-body{animation:none}.acc-chev{transition:none}}
/* ==== Couleurs : uniquement VERT = fait, ROUGE = pas fait ==== */
.pill.st-ok,.pill.st-nc{background:var(--ok-soft)!important;color:var(--ok)!important;border-color:transparent!important;text-decoration:none!important}
.pill.st-warn,.pill.st-bad,.pill.st-rdv,.pill.st-vide{background:var(--bad-soft)!important;color:var(--bad)!important;border-color:transparent!important}
.pill.st-bad.open,.pill.open{outline:2px solid currentColor}
.dot.st-ok,.dot.st-nc{background:var(--ok)!important;border:none!important}
.dot.st-warn,.dot.st-bad,.dot.st-rdv,.dot.st-vide{background:var(--bad)!important}
.prog,.mini{background:var(--bad-soft)!important}
.prog .pv,.mini i{background:var(--ok)!important}
.prog .pr{background:transparent!important}
.cbx .box{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.cbx input:checked+.box,.t-ver .cbx input:checked+.box{background:var(--ok)!important;border-color:var(--ok)!important}
/* ligne complète : les options non choisies passent en gris (plus de rouge quand tout est fait) */
.trow.is-ok .cbx input:not(:checked)+.box,.mut-disp.ok .cbx input:not(:checked)+.box{border-color:var(--line)!important;background:var(--card)!important}
.trow.is-ok .cbx input:not(:checked)~span,.mut-disp.ok .cbx input:not(:checked)~span{color:var(--ink2);opacity:.7}
.trow.thead .t-ver,.sec h3{color:var(--ink)!important}
.av{background:var(--gray-soft)!important;color:var(--ink)!important}
.li.active{background:var(--gray-soft)!important;border-color:var(--ink2)!important}
.chip[aria-pressed="true"]{background:var(--gray-soft)!important;color:var(--ink)!important;border-color:var(--ink2)!important}
.btn.teal{background:var(--navy)!important;color:#fff!important}
.nc[aria-pressed="true"]{background:var(--ok-soft)!important;color:var(--ok)!important;border-color:transparent!important}

/* Médecine du travail : BLEU quand la date approche */
.pill.st-warn[data-ed$="|medecine"]{background:#E3EEFB!important;color:#1F5FBF!important}
.dots .dot:nth-child(4).st-warn{background:#1F5FBF!important}
@media (prefers-color-scheme:dark){.pill.st-warn[data-ed$="|medecine"]{background:#16294A!important;color:#8DB8F5!important}.dots .dot:nth-child(4).st-warn{background:#8DB8F5!important}}

.vcard{background:var(--card)!important;color:var(--ink)!important;text-decoration:none!important}
.vcard h4,.vcard .cbx,.vcard label{color:var(--ink)!important;text-decoration:none!important}
.vcard .v-fields label{color:var(--ink2)!important}

/* date qui approche mais encore valide = à jour (vert), sauf médecine (bleu) */
.vcard.st-warn{border-left-color:var(--ok)}
.av-l.is-vide{background:var(--bg)!important}
/* RDV pris = c'est géré : vert, comme « À jour » */
.vcard.st-rdv{border-left-color:var(--ok)}
.vcard.st-rdv .v-st,.count.st-rdv{background:var(--ok-soft);color:var(--ok)}
.pill.st-rdv{background:var(--ok-soft)!important;color:var(--ok)!important}
.dot.st-rdv{background:var(--ok)!important;border:none!important}
.vcard.st-warn .v-st,.count.st-warn,.pill.st-warn,.acc-badge.st-warn{background:var(--ok-soft)!important;color:var(--ok)!important}
.dot.st-warn{background:var(--ok)!important}
.vcard.vc-medecine.st-warn{border-left-color:#1F5FBF}
.vcard.vc-medecine.st-warn .v-st,.vc-medecine .count.st-warn,.pill.st-warn[data-ed$="|medecine"]{background:#E3EEFB!important;color:#1F5FBF!important}
.dots .dot:nth-child(4).st-warn{background:#1F5FBF!important}

/* ---- Entretiens PDF (personnel administratif) ---- */
.pdf-zone{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin:8px 0;padding:10px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
.pdf-li{display:flex;align-items:center;gap:8px;width:100%}
.pdf-li small{flex:1;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-li .btn{padding:5px 12px}
.pe-aide{max-width:960px;margin:0 auto 10px;color:var(--ink2);font-size:13px;text-align:center}
#pePages{display:flex;flex-direction:column;align-items:center;gap:16px}
.pe-page{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.pe-page canvas{display:block}
.pe-layer{position:absolute;inset:0;cursor:text}
.gauge-btn{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.gauge-btn:hover{filter:brightness(1.15)}
.rdv-ov{position:fixed;inset:0;z-index:60;background:rgba(10,20,60,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.rdv-ov[hidden]{display:none}
.rdv-box{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:620px;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.rdv-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rdv-h h3{margin:0;font-size:19px}
.rdv-list{overflow:auto;padding:8px}
.todo-f{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.rdv-li .dot{flex:none}
.rdv-li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:10px;font:inherit;color:inherit;cursor:pointer}
.rdv-li:hover{background:var(--bg)}
.rdv-d{display:flex;flex-direction:column;min-width:96px}
.rdv-d small,.rdv-t small{color:var(--ink2);font-size:12.5px}
.rdv-t{flex:1;display:flex;flex-direction:column}
.mut-disp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px 10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2);background:color-mix(in srgb,var(--bad) 6%,transparent)}
.mut-disp.ok{background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
.mut-disp .lien{background:none;border:none;padding:0;color:var(--teal-ink);text-decoration:underline;font:inherit;cursor:pointer}
.mut-disp .mut-ch{display:inline-flex;gap:14px;flex-wrap:wrap}
.mut-disp input[type=date]{border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--bg);color:var(--ink);margin-left:6px}
.pe-modes{display:inline-flex;gap:6px}
.pe-modes .chip{color:#fff;border-color:rgba(255,255,255,.4)}
.pe-modes .chip[aria-pressed="true"]{background:#fff;color:var(--navy)!important;border-color:#fff}
.pe-qc{display:flex;align-items:flex-start;gap:8px;font-weight:700;font-size:14px;margin-bottom:4px;cursor:pointer}
.pe-qc .cbx{margin-top:1px}
.pe-q>span:not(.pr){display:block;font-weight:700;font-size:14px;margin-bottom:4px}
#peForm .fm-paper{margin-bottom:20px}
.fm-q>span.pr.pe-prc{display:none}
.pe-ed-h{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--teal);margin-bottom:8px}
.pe-ed-h b{font-family:"Baloo 2",sans-serif;font-size:19px}
.pe-ed-h .fm-in{font-weight:700;font-size:15px}
.pe-ed-it{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:start;padding:8px;border:1px dashed var(--line);border-radius:10px;margin:6px 0}
.pe-ed-it textarea{font-weight:600}
.pe-ed-opt{grid-column:1;display:flex;gap:14px;font-size:12.5px;color:var(--ink2)}
.pe-ed-opt label{display:flex;align-items:center;gap:4px;cursor:pointer}
.pe-ed-it .pe-tools{grid-column:2;grid-row:1 / span 2}
.pe-ed-tab{font-size:13px;color:var(--ink2);font-style:italic}

.pe-t.del:hover{background:#FDE8E8;border-color:var(--bad)}
.sig{position:relative;border:1px dashed var(--ink2);border-radius:10px;background:#fff}

.sig-ph{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--ink2);font-size:13px;pointer-events:none}

.mails-q{flex:1 1 100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px;background:var(--bg);color:var(--ink)}

.ed-cta{display:flex;justify-content:center;margin:-6px 0 14px}

.pe-ed-add{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.pe-zone{position:absolute;border:none;padding:0;background:rgba(255,226,92,.28);border-bottom:2px solid rgba(232,170,0,.55);border-radius:3px;cursor:text}
.pe-zone:hover,.pe-zone:focus-visible{background:rgba(255,226,92,.55);outline:none}
.pe-case{position:absolute;border:none;padding:0;background:rgba(255,226,92,.35);border-radius:2px;cursor:pointer;color:#0D1A5A;font-weight:900;line-height:1;display:grid;place-items:center}
.pe-case.on{background:rgba(255,226,92,.15)}

.pe-note{position:absolute;display:flex;align-items:flex-start}
.pe-grip{position:absolute;left:-16px;top:0;cursor:move;color:#1B2A6B;font-size:14px;line-height:1;padding:2px;touch-action:none;opacity:.55;user-select:none}
.pe-note:hover .pe-grip,.pe-note:focus-within .pe-grip{opacity:1}

{% raw %}
<script>
const DAY=86400000;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const fmt=s=>{if(!s)return"";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const days=s=>Math.round((new Date(s+"T00:00:00")-TODAY)/DAY);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
const first=n=>n.trim().split(/\s+/).slice(-1)[0];

const AGENCES=["Cronenbourg","Vendenheim","Personnel administratif"];
const DOCS_OBL=[["piece","Pièce d’identité"],["vitale","Carte vitale"],["dpae","DPAE"],["cpam","Attestation CPAM"],["rib","RIB"],["permis","Permis de conduire"],["grise","Carte grise"],["assurance","Attestation assurance voiture"],["diplomes","Diplômes"],["formations","Attestations de formations"],["employeurs","Attestations employeurs"],["cv","CV"],["dcc","DCC"],["test","Test"]];
const DOCS_SIGN=[["contrat","Contrat de travail"],["mutuelle","Mutuelle"]];
const CLASSEUR=[["duerp","DUERP"],["rqth","RQTH"],["confiance","Personne de confiance"],["digiposte","Consentement Digiposte"],["image","Droit à l’image"],["resto","Carte restaurant"],["reception","Attestation réception et engagement"],["casier","Visibilité du casier n°3"]];
// Arborescence des dossiers Ximi (GED de chaque salarié). Pour déplacer un document d'un dossier à l'autre,
// il suffit de changer sa clé de liste : docs = lignes « Présent / Vérifié », cl = cases du classeur.
const XIMI=[
 {n:"01_DOSSIER CANDIDATURE",docs:["cv","dcc","test"],cl:[]},
 {n:"02_DOCUMENTS LIES A L’EMBAUCHE",docs:["piece","vitale","cpam","rib","permis","grise","assurance","diplomes","employeurs","formations"],cl:[]},
 {n:"03_EMBAUCHE",docs:["dpae","contrat","mutuelle"],cl:["reception","confiance","digiposte","image","resto","duerp","rqth","casier"]},
 {n:"04_VIE PROFESSIONNELLE",docs:[],cl:[],vp:true},
 {n:"05_SUIVI DU PERSONNEL",docs:[],cl:[]},
 {n:"06_FORMATIONS",docs:[],cl:[]},
 {n:"07_DISCIPLINE",docs:[],cl:[]},
 {n:"08_COURRIER(S) DIVERS",docs:[],cl:[]},
 {n:"09_FIN DE CONTRAT",docs:[],cl:[]}];
const DATES=[]; // les dates Digiposte (envoi, identifiant, dépôt) ne sont plus suivies
const PIECE_T={cni:"CNI",titre:"Titre de séjour",passeport:"Passeport"};
const ECH=[["piece","Pièce d’identité",90],["cpam","Attestation CSS",30],["medecine","Médecine du travail",60],["permis","Permis de conduire",90],["mutperso","Fin mutuelle perso",30],["attcpam","Attestation CPAM (validité)",30]];
const STATUS_NEXT={manquant:"recu",recu:"verifie",verifie:"manquant"};
const STATUS_LAB={manquant:"Manquant",recu:"Reçu",verifie:"Vérifié",nc:"Non concerné"};
const labelOf=k=>([...DOCS_OBL,...DOCS_SIGN].find(x=>x[0]===k)||[,k])[1];

let S={arrivees:[],poste:[],feed:[]},LOADED=false,ERR="";
let UI={acc:{admin:false,vie:false,ent:false},tab:"poste",agence:"Toutes",cat:"tous",open:null,editor:null,etat:"traiter",adding:false,addErr:""};

function norm(p){
  p.docs=p.docs||{};
  // Ancienne case unique « CV / DCC / test » : DCC et test reprennent son état la première fois
  if(p.docs.cv&&!p.docs.dcc&&!p.docs.test){p.docs.dcc={s:p.docs.cv.s,c:""};p.docs.test={s:p.docs.cv.s,c:""}}[...DOCS_OBL,...DOCS_SIGN].forEach(([k])=>{if(!p.docs[k])p.docs[k]={s:"manquant",c:""}});
  [...DOCS_OBL,...DOCS_SIGN].forEach(([k])=>{if(p.docs[k].s==="recu")p.docs[k].s="verifie"}); // « présent » suffit
  NO_NC.forEach(k=>{if(p.docs[k].s==="nc")p.docs[k].s="manquant"}); // N/C impossible pour ces documents
  if(!p.docs.piece.t)p.docs.piece.t="cni";
  if(!p.docs.piece.types){p.docs.piece.types={};if(p.docs.piece.s==="recu"||p.docs.piece.s==="verifie")p.docs.piece.types[p.docs.piece.t]=true}
  p.classeur=p.classeur||{};CLASSEUR.forEach(([k])=>{p.classeur[k]=!!p.classeur[k]});
  p.dates=p.dates||{};DATES.forEach(([k])=>{p.dates[k]=p.dates[k]||""});
  p.ech=p.ech||{};ECH.forEach(([k])=>{p.ech[k]=p.ech[k]||{date:"",rdv:"",nc:k==="permis"&&!!(p.docs.permis&&p.docs.permis.s==="nc")}});
  // Permis de conduire : « non concerné » vaut pour la ligne du dossier ET pour l'échéance
  if(p.ech.permis.nc&&p.docs.permis.s!=="nc")p.docs.permis.s="nc";
  else if(p.docs.permis.s==="nc")p.ech.permis.nc=true;
  p.vie=p.vie||{};p.vie.avenants=Array.isArray(p.vie.avenants)?p.vie.avenants:[];p.vie.relances=Array.isArray(p.vie.relances)?p.vie.relances:[];
  VIE.forEach(([k])=>{p.vie[k]=p.vie[k]||{fait:false,c:""}});
  p.vie.ent=p.vie.ent||{};ENT.forEach(d=>{p.vie.ent[d.k]=Object.assign({le:"",rdv:"",c:"",nc:false},p.vie.ent[d.k])});
  p.id=String(p.id);return p;
}

async function api(url,opt={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});
  if(r.redirected&&r.url.includes("/login")){location.href="/login";throw new Error("login")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false)throw new Error(j.erreur||"erreur "+r.status);
  return j;
}
async function load(){
  try{const j=await api("/api/etat");S.feed=j.feed||[];S.arrivees=[];S.poste=[];S.archives=(j.archives||[]).map(norm);
    (j.salaries||[]).map(norm).forEach(p=>{p._etat=etatDossier(p);S.poste.push(p)});LOADED=true;ERR=""}
  catch(e){if(e.message!=="login")ERR=e.message}
  render();
}
let chain=Promise.resolve();
function push(p,news){
  p.manquants=manquants(p);
  // 🎉 confettis quand un dossier devient complet
  const avant=p._etat;p._etat=etatDossier(p);
  if(avant&&avant!=="complet"&&p._etat==="complet"&&!p.archive){setTimeout(()=>{confetti();toast("🎉 Dossier de "+first(p.nom)+" complet !")},250)}
  const body={manquants:p.manquants,docs:p.docs,classeur:p.classeur,dates:p.dates,ech:p.ech,vie:p.vie,phase:p.phase,categorie:catDe(p),email:p.email||"",embauche:p.embauche||""};
  if(news)body.news=news;
  chain=chain.then(()=>api("/api/salaries/"+p.id,{method:"PUT",body:JSON.stringify(body)}))
    .then(j=>{if(j&&j.feed){S.feed=j.feed;renderFeed()}})
    .catch(e=>{if(e.message!=="login")toast("Pas enregistré : "+e.message+". Rechargez la page.")});
}

function echStatus(e,th){
  if(e&&e.nc)return{k:"nc",t:"Non concerné",s:""};
  // RDV passé sans mise à jour = en retard (rouge) ; RDV à venir = géré (vert)
  if(e&&e.rdv&&days(e.rdv)<0)return{k:"bad",t:"RDV passé – à mettre à jour",s:"RDV du "+fmt(e.rdv)};
  if(e&&e.rdv)return{k:"rdv",t:"RDV le "+fmt(e.rdv),s:e.date?"valide jusqu’au "+fmt(e.date):""};
  if(!e||!e.date)return{k:"vide",t:"À renseigner",s:""};
  const d=days(e.date);
  if(d<0)return{k:"bad",t:"Expiré",s:"depuis "+(-d)+" j"};
  if(d<=th)return{k:"warn",t:"Dans "+d+" j",s:"le "+fmt(e.date)};
  return{k:"ok",t:"À jour",s:"jusqu’au "+fmt(e.date)};
}
// À traiter : une échéance proche/expirée/à renseigner OU une case du dossier pas cochée
// (seule la case CMU, simple information, n'est pas comptée).
const REL_T={mail:["✉️","Mail"],tel:["📞","Téléphone"],rdv:["🤝","RDV"]};
const derniereRel=p=>(p.vie&&p.vie.relances||[]).reduce((m,r)=>(!m||String(r.d)>String(m.d))?r:m,null);
const verifie=p=>!!(p.dates&&p.dates.verif);
// Permis de conduire : le mot « nouveau » ou « ancien » dans le commentaire de la ligne du dossier décide.
//  nouveau (ou rien d’écrit) → date de validité à renseigner ; ancien → validé d’office ; N/C → échéance masquée
const permisMode=p=>{if((p.docs.permis&&p.docs.permis.s==="nc")||(p.ech.permis&&p.ech.permis.nc))return"nc";
  const c=String((p.docs.permis||{}).c||"").toLowerCase();return /nouveau/.test(c)?"nouveau":/ancien/.test(c)?"ancien":"aucun"};
// Mutuelle : adhésion, ou dispense avec justificatif (attestation CSS ou mutuelle perso jusqu'à sa date anniversaire)
const mutPerso=p=>{const m=p.docs.mutuelle||{};return m.mut==="dispense"&&m.just==="perso"};
// Ouvre « La vie du salarié » sur la carte de l'échéance et place le curseur dans la date
function allerEch(ek){UI.acc.vie=true;UI.editor=null;render();
  const el=document.getElementById("vie-"+ek);if(!el)return;
  el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1500);
  const inp=el.querySelector(`[data-echd="${ek}|date"]`);if(inp)setTimeout(()=>inp.focus({preventScroll:true}),400)}
function mutStatut(d){if(!d.mut)return;d.s=d.mut==="adhesion"||(d.mut==="dispense"&&d.just&&d.jr)?"verifie":"manquant"}
// Adhésion à la mutuelle : l'attestation est demandée une fois, sans date de validité → pas d'échéance
const mutAdhesion=p=>((p.docs||{}).mutuelle||{}).mut==="adhesion";
// justificatif de dispense choisi (css, perso, cpam, autre) ou "" si pas de dispense
const justDisp=p=>{const m=(p.docs||{}).mutuelle||{};return m.mut==="dispense"?(m.just||""):""};
// attestation CSS suivie : pas en cas d'adhésion, ni si la dispense est justifiée autrement (CPAM, perso, autre)
const cssSuivie=p=>!mutAdhesion(p)&&!["cpam","perso","autre"].includes(justDisp(p));
const cpamSuivie=p=>justDisp(p)==="cpam";
const echListe=p=>ECH.filter(([k])=>(k!=="permis"||permisMode(p)!=="nc")&&(k!=="mutperso"||mutPerso(p))&&(k!=="cpam"||cssSuivie(p))&&(k!=="attcpam"||cpamSuivie(p)));
const echSt=(p,k,th)=>k==="permis"&&permisMode(p)==="ancien"?{k:"ok",t:"Ancien permis",s:"sans date de validité"}:echStatus(p.ech[k],th);
// Avenant pas encore signé : le dossier n'est pas complet
const avARegler=p=>((p.vie||{}).avenants||[]).some(x=>!x.signe);
const todo=p=>avARegler(p)||(!progress(p).done&&!verifie(p))||echListe(p).some(([k,,th])=>["vide","bad","warn"].includes(echSt(p,k,th).k));
function progress(a){
  let v=0,r=0,t=0;
  [...DOCS_OBL,...DOCS_SIGN].forEach(([k])=>{t++;const s=a.docs[k].s;if(s==="verifie"||s==="nc")v++;else if(s==="recu")r++});
  CLASSEUR.forEach(([k])=>{t++;if(a.classeur[k])v++});
  DATES.forEach(([k])=>{t++;if(a.dates[k])v++});
  return{v,r,t,done:v===t};
}
// Catégorie : intervenants terrain / personnel administratif
const CATS={terrain:"Intervenant terrain",administratif:"Administratif",mixte:"Terrain + Administratif"};
const catDe=p=>p.categorie==="administratif"?"administratif":p.categorie==="mixte"?"mixte":"terrain";
// « mixte » (terrain + administratif) compte dans les deux catégories
const estCat=(p,c)=>c==="tous"||catDe(p)===c||catDe(p)==="mixte";
const estAdmin=p=>catDe(p)!=="terrain";
// État du dossier : à traiter (rien de rempli), en cours (commencé ou échéance à régler), complet
const ETATS=[["traiter","À traiter"],["cours","En cours"],["complet","Complet"]];
function etatDossier(p){const pr=progress(p);
  // Complet = dossier 22/22 ET toutes les échéances à jour (aucune pastille rouge ou orange)
  // la médecine du travail ne bloque pas le « Complet » (elle reste suivie dans les échéances)
  const echOk=echListe(p).every(([k,,th])=>k==="medecine"||!["vide","bad","warn"].includes(echSt(p,k,th).k));
  if(pr.done&&echOk&&!avARegler(p))return"complet";
  if(pr.done)return"cours";
  const rien=[...DOCS_OBL,...DOCS_SIGN].every(([k])=>p.docs[k].s==="manquant"&&!String(p.docs[k].c||"").trim())
    &&CLASSEUR.every(([k])=>!p.classeur[k])&&DATES.every(([k])=>!p.dates[k]);
  return rien?"traiter":"cours";}
const byAg=l=>(UI.agence==="Toutes"?l:l.filter(p=>p.agence===UI.agence)).filter(p=>estCat(p,UI.cat));
const badgeCat=p=>`<span class="cat-badge ${catDe(p)}">${{administratif:"Administratif",mixte:"Terrain + Admin"}[catDe(p)]||"Terrain"}</span>`;

function ring(pct,col,light){
  const r=28,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="${r}" fill="none" stroke="${light?"rgba(255,255,255,.18)":"var(--gray-soft)"}" stroke-width="9"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .6s"/><text x="36" y="41" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="16" fill="${light?"#fff":"var(--ink)"}">${pct}%</text></svg>`;
}
// Tous les rendez-vous à venir (médecine du travail, échéances, entretiens), du plus proche au plus lointain
function listeRdv(){const l=[];
  S.poste.forEach(p=>{
    ECH.forEach(([k,lab])=>{const e=p.ech[k];if(e&&e.rdv&&days(e.rdv)>=0)l.push({d:e.rdv,p,t:lab,ico:k==="medecine"?"🩺":"📄"})});
    ENT.forEach(x=>{const e=p.vie.ent[x.k];if(e&&e.rdv&&!e.nc&&days(e.rdv)>=0)l.push({d:e.rdv,p,t:x.t,ico:x.ico})})});
  return l.sort((a,b)=>String(a.d).localeCompare(String(b.d))||a.p.nom.localeCompare(b.p.nom,"fr"))}
function ouvrirRdv(){
  const l=listeRdv();let el=document.getElementById("rdvPanel");
  if(!el){el=document.createElement("div");el.id="rdvPanel";el.className="rdv-ov";document.body.appendChild(el)}
  const quand=d=>{const n=days(d);return n===0?"Aujourd’hui":n===1?"Demain":"Dans "+n+" jours"};
  el.innerHTML=`<div class="rdv-box" role="dialog" aria-modal="true" aria-label="Rendez-vous à venir">
    <div class="rdv-h"><h3>📅 Rendez-vous à venir (${l.length})</h3><button class="btn light" data-rdvclose>Fermer</button></div>
    <div class="rdv-list">${l.length?l.map(r=>`<button class="rdv-li" data-rdvopen="${r.p.id}">
      <span class="rdv-d"><b>${fmt(r.d)}</b><small>${quand(r.d)}</small></span>
      <span class="rdv-t"><b>${esc(r.p.nom)}</b><small>${r.ico} ${esc(r.t)}</small></span><span aria-hidden="true">›</span></button>`).join("")
      :`<div class="empty small">Aucun rendez-vous planifié.</div>`}</div></div>`;
  el.hidden=false;document.body.classList.add("fm-open");
}
// ---- Liste « À traiter » : échéances + dossiers incomplets, filtrables par type ----
const TODO_GRAV={bad:0,vide:1,warn:2,doss:3};
function listeTodo(){const l=[];
  S.poste.forEach(p=>{
    echListe(p).forEach(([k,lab,th])=>{const st=echSt(p,k,th);if(!["vide","bad","warn"].includes(st.k))return;
      l.push({p,f:k,t:lab,st:st.k,txt:st.t+(st.s?", "+st.s:""),d:(p.ech[k]||{}).date||""})});
    ((p.vie||{}).avenants||[]).forEach(x=>{if(!x.signe)l.push({p,f:"avenant",t:"Avenant à faire signer",st:"warn",txt:(x.date?"du "+fmt(x.date):"")+(String(x.c||"").trim()?(x.date?" · ":"")+String(x.c).trim():""),d:""})});
    const pr=progress(p);if(!pr.done&&!verifie(p))l.push({p,f:"dossier",t:"Dossier incomplet",st:"doss",txt:pr.v+" / "+pr.t+" éléments validés",d:""})});
  return l.sort((a,b)=>TODO_GRAV[a.st]-TODO_GRAV[b.st]||String(a.d||"9").localeCompare(String(b.d||"9"))||a.p.nom.localeCompare(b.p.nom,"fr"))}
let TODO_F="tous";
function ouvrirTodo(){
  const tout=listeTodo(),l=TODO_F==="tous"?tout:tout.filter(x=>x.f===TODO_F);
  const types=[["tous","Tout"],...ECH.map(([k,lab])=>[k,lab]),["avenant","Avenant à signer"],["dossier","Dossier incomplet"]].filter(([k])=>k==="tous"||tout.some(x=>x.f===k));
  let el=document.getElementById("rdvPanel");
  if(!el){el=document.createElement("div");el.id="rdvPanel";el.className="rdv-ov";document.body.appendChild(el)}
  el.innerHTML=`<div class="rdv-box" role="dialog" aria-modal="true" aria-label="À traiter">
    <div class="rdv-h"><h3>🔥 À traiter (${l.length})</h3><button class="btn light" data-rdvclose>Fermer</button></div>
    <div class="todo-f">${types.map(([k,lab])=>`<button class="chip" data-todof="${k}" aria-pressed="${TODO_F===k}">${lab} (${k==="tous"?tout.length:tout.filter(x=>x.f===k).length})</button>`).join("")}</div>
    <div class="rdv-list">${l.length?l.map(r=>`<button class="rdv-li" data-rdvopen="${r.p.id}">
      <i class="dot st-${r.st==="doss"?"bad":r.st}" aria-hidden="true"></i>
      <span class="rdv-t"><b>${esc(r.p.nom)}</b><small>${esc(r.t)} · ${esc(r.txt)}</small></span><span aria-hidden="true">›</span></button>`).join("")
      :`<div class="empty small">Rien à traiter dans cette catégorie 🎉</div>`}</div></div>`;
  el.hidden=false;document.body.classList.add("fm-open");
}
document.addEventListener("click",ev=>{const t=ev.target.closest&&ev.target.closest("#todoBtn,[data-todof]");if(!t)return;
  if(t.dataset.todof)TODO_F=t.dataset.todof;else TODO_F="tous";ouvrirTodo()});
function fermerRdv(){const el=document.getElementById("rdvPanel");if(el)el.hidden=true;document.body.classList.remove("fm-open")}
document.addEventListener("click",ev=>{
  const t=ev.target;
  if(t.closest&&t.closest("#rdvBtn")){ouvrirRdv();return}
  if(t.id==="rdvPanel"||(t.closest&&t.closest("[data-rdvclose]"))){fermerRdv();return}
  const o=t.closest&&t.closest("[data-rdvopen]");
  if(o){fermerRdv();UI.tab="poste";UI.etat=etatDossier(find(o.dataset.rdvopen)||find(+o.dataset.rdvopen));UI.cat="tous";UI.open=find(o.dataset.rdvopen)?o.dataset.rdvopen:+o.dataset.rdvopen;UI.editor=null;render();
    const b=document.querySelector(".bar-tabs");if(b)window.scrollTo({top:b.offsetTop-10,behavior:"smooth"})}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")fermerRdv()});
function renderHero(){

  const aT=S.poste.filter(todo).length+S.arrivees.length;
  const rdv=listeRdv().length;
  document.getElementById("hero").innerHTML=
   `<div class="gauge total">${ring(pct,"var(--teal)",true)}<div><h3>Toute l’équipe</h3><p>${ok} dossier${ok>1?"s":""} sur ${tot} à jour${pct===100?", bravo":""}</p></div></div>
    <button class="gauge gauge-btn" id="todoBtn" aria-label="Voir la liste des choses à traiter"><div class="bignum" style="color:#FF8A6B">${aT}</div><div><h3>À traiter</h3><p>Échéances proches, expirées ou à renseigner, et dossiers incomplets · <u>voir la liste</u></p></div></button>

}

// ---- Vue en deux colonnes : liste des salariés à gauche, fiche à droite ----
function score(p){let m=9999;echListe(p).forEach(([k])=>{const e=p.ech[k];if(e.nc||e.rdv||(k==="permis"&&permisMode(p)==="ancien"))return;if(!e.date)m=Math.min(m,-999);else m=Math.min(m,days(e.date))});return m}
const alpha=(x,y)=>x.nom.localeCompare(y.nom,"fr");
// Recherche par nom : sans accents ni majuscules, dans tout l'onglet
const sansAcc=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const trouve=p=>!UI.q||sansAcc(p.nom).includes(sansAcc(UI.q).trim());
function listeOnglet(){
  if(UI.tab==="archives")return byAg(S.archives||[]).filter(trouve).sort(alpha);
  if(UI.q)return byAg(UI.tab==="arrivees"?S.arrivees:S.poste).filter(trouve).sort(alpha);
  if(UI.tab==="arrivees")return byAg(S.arrivees).slice().sort(alpha);
  let l=byAg(S.poste);
  l=l.filter(p=>etatDossier(p)===UI.etat).sort(alpha);
  return l;
}
function itemArchive(p){
  const act=UI.open===p.id;
  return `<div class="li-row"><button class="li ${act?"active":""}" data-open="${p.id}" aria-current="${act}">
    <div class="av" style="opacity:.6">${initials(p.nom)}</div>
    <div class="li-t"><b>${esc(p.nom)}${estAdmin(p)?" "+badgeCat(p):""}</b><span>${p.archive_le?"Archivé(e) le "+fmt(p.archive_le):"Archivé(e)"}</span></div></button></div>`;
}
function itemListe(p){
  if(UI.tab==="archives")return itemArchive(p);
  const pr=progress(p),act=UI.open===p.id;
  // 1re pastille = dossier administratif (rouge tant qu'il n'est pas complet ; la CMU ne compte pas)
  const dots=`<i class="dot st-${pr.done?"ok":verifie(p)?"warn":"bad"}" title="Dossier : ${pr.done?"complet":(verifie(p)?"incomplet mais vérifié le "+fmt(p.dates.verif):"incomplet")+" ("+pr.v+"/"+pr.t+")"}"></i>`+
    echListe(p).map(([k,l,th])=>{const s=echSt(p,k,th);return `<i class="dot st-${s.k}" title="${l} : ${s.t}"></i>`}).join("")+(avARegler(p)?`<i class="dot st-warn" title="Avenant à faire signer"></i>`:"");
  return `<div class="li-row"><button class="li ${act?"active":""}" data-open="${p.id}" aria-current="${act}">
    <div class="av">${initials(p.nom)}</div>
    <div class="li-t"><b>${esc(p.nom)}${estAdmin(p)?" "+badgeCat(p):""}</b><span>${p.embauche?"Embauché(e) le "+fmt(p.embauche):"&nbsp;"}${(()=>{const r=!pr.done&&derniereRel(p);return r?" · relancé(e) le "+fmt(r.d)+" ("+(REL_T[r.t]||REL_T.mail)[1].toLowerCase()+")":""})()}</span>
      <div class="li-m"><span class="dots">${dots}</span><span class="mini"><i style="width:${pr.v/pr.t*100}%"></i></span><small>${pr.v}/${pr.t}</small></div></div></button><button class="li-x li-mail" data-mailrel="${p.id}" title="Envoyer un mail de relance à ${esc(p.nom)}" aria-label="Mail de relance à ${esc(p.nom)}">${ICO_MAIL}</button><button class="li-x li-arch" data-archiver="${p.id}" title="Archiver ${esc(p.nom)} (a quitté AID’Aux)" aria-label="Archiver ${esc(p.nom)}">🗄</button><button class="li-x" data-retirer="${p.id}" title="Supprimer ${esc(p.nom)}" aria-label="Supprimer ${esc(p.nom)}">×</button></div>`;
}
function listeHTML(l,vide){
  if(l.length)return l.map(itemListe).join("");
  return UI.q?`<div class="empty small">Aucun salarié ne correspond à « ${esc(UI.q)} ».</div>`:vide;
}
// on ne redessine que la liste pendant la frappe (le champ garde le curseur)
document.addEventListener("input",ev=>{
  if(ev.target.id!=="recherche")return;
  UI.q=ev.target.value;
  const w=document.querySelector(".col-list .li-wrap");
  if(w)w.innerHTML=listeHTML(listeOnglet(),"");

function viewSplit(){

  const base=UI.tab==="archives"?(S.archives||[]):UI.tab==="arrivees"?S.arrivees:S.poste;
  const nCat=c=>(UI.agence==="Toutes"?base:base.filter(p=>p.agence===UI.agence)).filter(p=>estCat(p,c)).length;
  let head=`<div class="li-head li-cat" role="group" aria-label="Catégorie de salariés">${[["tous","Tous"],["terrain","Terrain"],["administratif","Administratifs"]].map(([c,l])=>`<button class="chip" data-cat="${c}" aria-pressed="${UI.cat===c}">${l} (${nCat(c)})</button>`).join("")}</div>`;
  head+=`<div class="li-search"><input type="search" id="recherche" value="${esc(UI.q||"")}" placeholder="🔍 Rechercher un salarié…" aria-label="Rechercher un salarié" autocomplete="off"></div>`;
  if(UI.tab==="poste"){

    head+=`<div class="li-head">${ETATS.map(([e,l])=>`<button class="chip" data-etat="${e}" aria-pressed="${UI.etat===e}">${l} (${nE(e)})</button>`).join("")}</div>`;
  }
  const vide=UI.tab==="archives"?`<div class="empty small">Aucun salarié archivé.</div>`:UI.tab==="arrivees"?`<div class="empty small">Aucune arrivée en cours.<br>Ajoutez un nouveau salarié pour suivre son dossier d’embauche.</div>`
    :`<div class="empty small">${{traiter:"Aucun dossier vide : tous les dossiers ont été commencés.",cours:"Aucun dossier en cours.",complet:"Aucun dossier complet pour l’instant."}[UI.etat]}</div>`;
  const sel=UI.open&&find(UI.open);

  </div>`;
}
const cb=(attr,checked,label,dis)=>`<label class="cbx"><input type="checkbox" ${attr} ${checked?"checked":""} ${dis?"disabled":""}><span class="box" aria-hidden="true"></span>${label?`<span>${label}</span>`:""}</label>`;
const present=d=>d.s==="recu"||d.s==="verifie";
const NO_NC=["piece","vitale","cpam"]; // pas de « non concerné » : CNI / titre de séjour, carte vitale, attestation CPAM
// Pièce d'identité valable : CNI seule, OU titre de séjour avec passeport (ou passeport « non concerné », ex. réfugiés)
function pieceStatut(d){const ty=d.types||{};const ok=ty.cni||(ty.titre&&(ty.passeport||d.pnc));
  d.s=ok?"verifie":"manquant"}
function ligneDoc(a,k,lab){
  const d=a.docs[k],sansNc=NO_NC.includes(k),nc=!sansNc&&d.s==="nc";
  let pres;
  if(k==="piece"){
    const ty=d.types||{};
    // CNI cochée → passeport et titre masqués ; passeport ou titre cochés → CNI masquée
    const visibles=Object.entries(PIECE_T).filter(([v])=>ty.cni?v==="cni":(ty.passeport||ty.titre||d.pnc)?v!=="cni":true);
    pres=`<div class="ptypes">${visibles.map(([v,t])=>v==="passeport"
      ?`<span style="display:inline-flex;align-items:center;gap:8px">${cb(`data-ptyp="${v}" aria-label="${t}"`,!!ty[v]&&!d.pnc,t,nc||d.pnc)}<button class="nc" data-ncpass aria-pressed="${!!d.pnc}" title="Passeport non concerné (ex. réfugié)" aria-label="Passeport non concerné">N/C</button></span>`
      :cb(`data-ptyp="${v}" aria-label="${t}"`,!!ty[v],t,nc)).join("")}</div>`;
  } else if(k==="mutuelle"){
    pres=`<div class="ptypes">${cb(`data-mut="adhesion" aria-label="Adhésion à la mutuelle"`,d.mut==="adhesion","Adhésion",nc)}${cb(`data-mut="dispense" aria-label="Dispense de mutuelle"`,d.mut==="dispense","Dispense",nc)}</div>`;
  } else pres=cb(`data-pres="${k}" aria-label="${lab} présent dans le dossier"`,present(d),"",nc);
  const saisine=k==="piece"&&((d.types||{}).titre||d.saisine)
    ?`<div class="saisine" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px 10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)">
      <span><b style="color:var(--ink)">Saisine</b> <small>(vérification préalable à l’embauche du titre de séjour)</small></span>
      <label style="display:flex;align-items:center;gap:6px">Demande faite le <input type="date" min="2000-01-01" max="2040-12-31" data-saisine value="${d.saisine||""}" aria-label="Date de la saisine" style="border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--bg);color:var(--ink)"></label>
      <button class="nc" data-saisine-today>Aujourd’hui</button></div>`:"";
  const disp=k==="mutuelle"&&d.mut==="dispense"&&!nc;
  const dispense=disp?`<div class="saisine mut-disp ${d.just&&d.jr?"ok":""}">
      <span><b style="color:var(--ink)">Dispense : justificatif obligatoire</b></span>
      <span class="mut-ch">${cb(`data-mutjust="css" aria-label="Justificatif : attestation CSS"`,d.just==="css","Attestation CSS")}${cb(`data-mutjust="perso" aria-label="Justificatif : mutuelle personnelle"`,d.just==="perso","Mutuelle personnelle")}${cb(`data-mutjust="cpam" aria-label="Justificatif : attestation CPAM"`,d.just==="cpam","CPAM")}${cb(`data-mutjust="autre" aria-label="Justificatif : autre"`,d.just==="autre","Autre")}</span>
      ${d.just?cb(`data-mutjr aria-label="Justificatif reçu"`,!!d.jr,"<b>Justificatif reçu</b>"):""}
      ${!d.just?`<small style="color:var(--bad)">Choisissez le justificatif fourni par le salarié.</small>`:!d.jr?`<small style="color:var(--bad)">Justificatif à demander au salarié.</small>`:d.just==="autre"?`<small>Précisez le justificatif dans le commentaire de la ligne Mutuelle.</small>`
        :(()=>{const ek=d.just==="css"?"cpam":d.just==="cpam"?"attcpam":"mutperso",dt=(a.ech[ek]||{}).date;return dt?`<small>Valable jusqu’au ${fmt(dt)} · <button class="lien" data-mutgo="${ek}">modifier la date</button></small>`:`<small style="color:var(--bad)">Date de validité à renseigner · <button class="lien" data-mutgo="${ek}">la saisir</button></small>`})()}
    </div>`:"";
  return `<div class="trow ${nc?"is-nc":""} ${d.s==="verifie"?"is-ok":""}">
    <div class="t-doc">${lab}</div>

// Ajoute n mois à une date AAAA-MM-JJ (31 août + 6 mois = 28 février, pas 3 mars)
function addMois(s,n){const [y,m,d]=s.split("-").map(Number);const t=y*12+(m-1)+n,Y=Math.floor(t/12),M=t%12;
  const last=new Date(Y,M+1,0).getDate();return Y+"-"+String(M+1).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0")}
// Échéance : suivis = embauche + 1/3/6 mois ; annuel = dernier entretien + 1 an (sinon 1er anniversaire
// d'embauche) ; parcours = dernier entretien + 4 ans (sinon 1er anniversaire, avec l'entretien annuel).
function entDue(a,d){const e=a.vie.ent[d.k];
  if(d.mois)return a.embauche?addMois(a.embauche,d.mois):"";
  if(e.le)return addMois(e.le,d.every);
  return a.embauche?addMois(a.embauche,12):"";
}
function entStatus(a,d){const e=a.vie.ent[d.k],due=entDue(a,d);
  if(e.nc)return{k:"nc",t:"Non concerné",n:"—",u:"non concerné",due};
  if(d.mois&&e.le)return{k:"ok",t:"Fait le "+fmt(e.le),n:"✓",u:"entretien réalisé",due};
  if(!due)return{k:"vide",t:"Date d’embauche manquante",n:"?",u:"renseigner la date d’embauche en haut de la section",due};
  const j=days(due);
  if(j>=0)return{k:j<=30?"warn":"ok",t:(j<=30?"Dans ":"À venir, dans ")+j+" j",n:"J-"+j,u:"échéance le "+fmt(due),due};
  // Très en retard sans aucune date saisie : probablement déjà fait avant l'appli -> à renseigner
  if(!e.le&&j<-60)return{k:"vide",t:"À renseigner",n:"?",u:"échéance du "+fmt(due)+" : déjà fait ? saisir la date",due};
  return{k:"bad",t:"En retard de "+(-j)+" j",n:"+"+(-j),u:"échéance le "+fmt(due),due};
}

// ───── Import des emails depuis un export Excel de Ximi ─────
const nk=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z]+/g," ").trim();
const cle=x=>nk(x).split(" ").filter(Boolean).sort().join(" ");
function lireXimi(rows){
  // Cherche la ligne d'en-tête qui contient une colonne email
  let h=-1,cMail=-1;
  for(let i=0;i<Math.min(rows.length,20)&&h<0;i++){
    (rows[i]||[]).forEach((c,j)=>{if(cMail<0&&/MAIL/.test(nk(c))){cMail=j;h=i}});
  }
  if(h<0)throw new Error("Aucune colonne « email » trouvée dans le fichier");
  const head=rows[h].map(nk);
  const cPre=head.findIndex(c=>/^PRENOM/.test(c));
  let cNom=head.findIndex(c=>/^NOM( D USAGE| USUEL)?$/.test(c));
  if(cNom<0)cNom=head.findIndex(c=>/^NOM/.test(c)&&!/NAISSANCE|JEUNE/.test(c));
  if(cNom<0)cNom=head.findIndex(c=>/SALARIE|INTERVENANT|IDENTITE|COLLABORATEUR/.test(c));
  if(cNom<0)throw new Error("Aucune colonne « nom » trouvée dans le fichier");
  const out=[];
  rows.slice(h+1).forEach(r=>{
    const mail=String(r[cMail]||"").trim().toLowerCase();
    const nom=[r[cNom],cPre>=0?r[cPre]:""].join(" ").trim();
    if(nom&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))out.push({nom,mail});
  });
  return out;
}
function rapprocher(lignes){
  const tous=[...S.arrivees,...S.poste],idx={};
  lignes.forEach(l=>{idx[cle(l.nom)]=l.mail});
  const ok=[],deja=[],absents=[];
  tous.forEach(a=>{
    let m=idx[cle(a.nom)];
    if(!m){ // repli : tous les mots du nom de l'app se retrouvent dans une ligne Ximi
      const mots=cle(a.nom).split(" ");
      const c=lignes.filter(l=>{const k=" "+cle(l.nom)+" ";return mots.every(w=>k.includes(" "+w+" "))});
      if(c.length===1)m=c[0].mail;
    }
    if(!m)absents.push(a);
    else if((a.email||"").toLowerCase()===m)deja.push(a);
    else ok.push({a,mail:m});
  });
  return {ok,deja,absents};
}

  const r=UI.imp;
  const li=r.ok.map(({a,mail})=>`<li><b>${esc(a.nom)}</b> → ${esc(mail)}${a.email?` <small style="color:var(--ink2)">(remplace ${esc(a.email)})</small>`:""}</li>`).join("");
  const ab=r.absents.map(a=>esc(a.nom)).join(", ");
  return `<div class="detail" style="margin-bottom:14px"><h3 style="font-size:20px;margin-bottom:6px">Import des emails Ximi</h3>

document.addEventListener("change",async ev=>{
  if(ev.target.id!=="impFile")return;
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  try{
    if(!window.XLSX)throw new Error("lecteur Excel non chargé, rechargez la page");
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    const lignes=lireXimi(rows);
    if(!lignes.length)throw new Error("aucune ligne avec un email valide");
    UI.imp=rapprocher(lignes);UI.adding=false;render();

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("confetti"),cx=cv.getContext("2d"),W=innerWidth,H=innerHeight;
  cv.width=W;cv.height=H;
  const cols=["#1B2A6B","#13B3B3","#E8583A","#FFC94A","#8E6CFF","#FF5FA2","#2ECC71","#FFFFFF"];
  const ps=[];
  // 3 explosions (centre puis les deux côtés) + deux canons dans les coins du bas + une pluie depuis le haut
  const boum=(x,y,n,force,t)=>{for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,v=Math.random()*force+force*.35;
    ps.push({x,y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v-force*.5,r:Math.random()*9+5,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4,t,forme:Math.random()<.3?"rond":Math.random()<.5?"etoile":"ruban"})}};
  const canon=(x,dir,t)=>{for(let i=0;i<120;i++){const v=Math.random()*14+16;const ang=-Math.PI/2+dir*(Math.random()*.55+.15);
    ps.push({x,y:H+10,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,r:Math.random()*9+5,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4,t,forme:Math.random()<.5?"ruban":"rond"})}};
  boum(W/2,H*.42,220,22,0);canon(0,1,4);canon(W,-1,4);boum(W*.22,H*.35,140,17,22);boum(W*.78,H*.35,140,17,30);
  for(let i=0;i<160;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:Math.random()*3+2,r:Math.random()*8+5,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3,t:10,forme:"ruban"});
  const etoile=(r)=>{cx.beginPath();for(let k=0;k<10;k++){const rr=k%2?r*.45:r,an=k*Math.PI/5;cx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}cx.closePath();cx.fill()};
  // petit flash au départ
  let f=0;(function step(){cx.clearRect(0,0,W,H);
    if(f<8){cx.fillStyle=`rgba(255,201,74,${.18*(1-f/8)})`;cx.fillRect(0,0,W,H)}
    ps.forEach(p=>{if(f<p.t)return;p.vy+=.32;p.vx*=.985;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
      if(p.forme==="rond"){cx.beginPath();cx.arc(0,0,p.r/2.4,0,7);cx.fill()}else if(p.forme==="etoile")etoile(p.r/1.6);else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2.2);
      cx.restore()});
    if(++f<300)requestAnimationFrame(step);else cx.clearRect(0,0,W,H)})();
}

const PDF_TYPE={annuel:"annuel",parcours:"pro"};

const PDFS={},PDF_CHARGE={};
async function chargerPdf(sid,force){
  if(PDF_CHARGE[sid]&&!force)return;PDF_CHARGE[sid]=true;
  try{const j=await api("/api/salaries/"+sid+"/pdf");PDFS[sid]=j.pdf||[]}catch(e){PDFS[sid]=[];if(e.message!=="login")toast("Entretiens PDF indisponibles : "+e.message)}
  if(UI.open==sid)render();
}
function cartePdf(a,d){
  const typ=PDF_TYPE[d.k];
  if(PDFS[a.id]===undefined)chargerPdf(a.id);
  const l=(PDFS[a.id]||[]).filter(x=>x.type===typ);
  const liste=PDFS[a.id]===undefined?`<small style="color:var(--ink2)">Chargement…</small>`
    :l.length?l.map(x=>`<div class="pdf-li"><button class="btn" data-pdfopen="${x.id}">📄 ${x.annee}</button><small title="${esc(x.nom)}">${esc(x.nom)}</small><button class="li-x" data-pdfdel="${x.id}" title="Supprimer ce PDF" aria-label="Supprimer le PDF ${x.annee}">×</button></div>`).join("")
    :`<small style="color:var(--ink2)">Aucun PDF importé pour l’instant.</small>`;
  return `<div class="pdf-zone"><b>📄 ${PDF_LIB[typ]} : documents PDF</b>${liste}
    <button class="chip" data-pdfadd="${typ}">＋ Importer le PDF de l’année</button></div>`;
}

const BOX_RE=/^[☐□❑❒■☑☒]\s*/;
const DOTS_RE=/^[\s.…_·‥:-]{6,}$/;
const ID_LABELS=[/^nom et pr[eé]nom/i,/^poste/i,/^agence/i,/^date d.embauche/i,/^date et lieu/i,/^personne\(?s?\)? pr[eé]sente/i,/^p[eé]riode concern/i,/^service/i,/^fonction/i,/^responsable/i,/^date de l.entretien/i];

async function peStructure(doc){
  const lignes=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p),v=page.getViewport({scale:1}),tc=await page.getTextContent();
    const its=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>{const [x,y]=v.convertToViewportPoint(it.transform[4],it.transform[5]);
      return{x,y,w:it.width,s:it.str,fs:Math.hypot(it.transform[2],it.transform[3])||10}}).sort((a,b)=>a.y-b.y||a.x-b.x);
    const L=[];its.forEach(it=>{const l=L[L.length-1];if(l&&Math.abs(l.y-it.y)<Math.max(2.5,it.fs*0.3))l.its.push(it);else L.push({y:it.y,its:[it]})});
    L.forEach(l=>{l.its.sort((a,b)=>a.x-b.x);let t="",fin=null;const cols=[""];
      l.its.forEach(it=>{if(fin!==null&&it.x-fin>it.fs*2.5)cols.push("");
        if(fin!==null&&it.x-fin>it.fs*0.22&&!/\s$/.test(t)&&!/^\s/.test(it.s)){t+=" ";cols[cols.length-1]+=" "}t+=it.s;cols[cols.length-1]+=it.s;fin=it.x+it.w});
      lignes.push({p,y:l.y,x:l.its[0].x,t:t.replace(/\s+/g," ").trim(),cols:cols.map(c=>c.trim()).filter(Boolean),fs:Math.max(...l.its.map(i=>i.fs)),pw:v.width})});
  }
  // taille du texte courant = la plus fréquente
  const freq={};lignes.forEach(l=>{const k=Math.round(l.fs);freq[k]=(freq[k]||0)+l.t.length});
  const corps=+Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0]||10;

  const pages={};lignes.forEach(l=>{if(DOTS_RE.test(l.t)||/[☐□❑❒\uf06f\uf0a8\uf071]/.test(l.t))return;(pages[l.t]=pages[l.t]||new Set()).add(l.p)});
  const repete=t=>doc.numPages>1&&pages[t]&&pages[t].size>=2;

  let grille=null;
  const finGrille=()=>{if(!grille)return;const g=grille;grille=null;
    g.frags.forEach(f=>{let best=null,dm=1e9;g.rows.forEach(r=>{if(r.p!==f.p)return;const dd=Math.abs(r.y-f.y);if(dd<dm){dm=dd;best=r}});if(best)best.frags.push(f)});
    g.rows.forEach(r=>{const parts=[...r.frags,...(r.crit?[{y:r.y,t:r.crit}]:[])].sort((a,b)=>a.y-b.y);r.crit=parts.map(x=>x.t).join(" ");delete r.frags});delete g.frags};
  const nouvSec=t=>{finGrille();sec={t,items:[]};S.secs.push(sec)};
  lignes.forEach((l,i)=>{const t=l.t;
    if(repete(t)||/^aid.?aux(\s*\|.*)?$/i.test(t)||/^(page\s*)?\d+(\s*(\/|sur)\s*\d+)?$/i.test(t))return; // en-têtes, n° de page
    if(!S.titre&&l.p===1&&l.fs>=corps*1.5){S.titre=t;prev={k:"titre"};return}
    if(prev&&prev.k==="titre"&&!S.sous&&!sec&&!ID_LABELS.some(r=>r.test(t))){S.sous=t;prev={k:"sous"};return}
    if(!sec&&ID_LABELS.some(r=>r.test(t))){S.ids.push(t);prev={k:"id"};return}
    if(DOTS_RE.test(t)){ // ligne de pointillés : zone de réponse de la question précédente
      if(!sec)nouvSec("");const it=sec.items[sec.items.length-1];
      if(it&&it.type==="q")it.ans=true;else if(it&&it.type==="note"){it.type="q";it.ans=true}else sec.items.push({type:"q",t:"Réponse",ans:true});
      prev={k:"dots"};return}
    // question suivie de pointillés sur la même ligne (« Question : ........ »)
    const mDots=t.match(/^(.*?\S)\s*[.…_]{6,}\s*$/);
    if(/^\d+[.)]\s+\S/.test(t)&&l.fs>=corps*1.12&&!BOX_RE.test(t)){nouvSec(t);prev={k:"h"};return}
    // signatures : un bloc propre, le reste du texte de cette partie est ignoré
    if(/^validation et signature/i.test(t)){nouvSec("Validation et signatures");sec.sig=true;prev={k:"h"};return}
    if(sec&&sec.sig){if(!sec.items.length&&t.length>40&&!/signature\s*:/i.test(t))sec.items.push({type:"note",t});return}
    if(!sec)nouvSec("");
    // grille d'appréciation sous un en-tête de tableau : lignes « ☐1 ☐2 ☐3 ☐4 ☐N/A » + libellés du critère
    // (le libellé peut être sur la même ligne, ou au-dessus / en dessous quand il tient sur deux lignes)

      if(pres&&!nb&&l.x>=grille.x-1&&l.x<grille.x+l.pw*0.22){grille.frags.push({p:l.p,y:l.y,t});prev={k:"row",l};return}
      finGrille()}

    if(l.cols.length>=3&&!BOX_RE.test(t)){finGrille();grille={type:"table",t,cols:l.cols,n:4,x:l.x,rows:[],frags:[]};sec.items.push(grille);prev={k:"table",l};return}
    const last=sec.items[sec.items.length-1],ecart=prev&&prev.l&&prev.l.p===l.p?l.y-prev.l.y:99;
    if(BOX_RE.test(t)){const q=t.replace(BOX_RE,"");sec.items.push({type:"q",box:true,t:mDots?mDots[1].replace(BOX_RE,""):q,ans:!!mDots});prev={k:"q",l};return}
    if(mDots){sec.items.push({type:"q",t:mDots[1],ans:true});prev={k:"q",l};return}
    // suite d'une question ou d'un paragraphe sur la ligne suivante
    if(last&&prev&&(prev.k==="q"||prev.k==="note")&&!last.ans&&ecart<l.fs*1.7&&(last.type==="note"||l.x>=(prev.l.x-2))){last.t+=" "+t;prev={k:prev.k,l};return}
    sec.items.push({type:"note",t});prev={k:"note",l};
  });
  finGrille();

  S.secs.forEach((s,i)=>s.items.forEach((it,j)=>{it.key=i+"|"+slug(it.t)+"|"+j}));
  S.secs=S.secs.filter(s=>s.t||s.items.length);

  return S;
}

// Zones de réponse : lignes de pointillés / soulignés repérées dans le texte du PDF
async function peZones(pg,page){
  pg._zones=[];pg._cases=[];
  try{const v=page.getViewport({scale:1}),tc=await page.getTextContent();
    const its=[];
    tc.items.forEach(it=>{if(!it.str||!/^[\s.…_·‥]{6,}$/.test(it.str)||!/[.…_·‥]{6,}|…{3,}/.test(it.str))return;
      const [x,y]=v.convertToViewportPoint(it.transform[4],it.transform[5]);
      its.push({x,y,w:it.width*v.scale||it.width})});
    // fusionne les morceaux sur la même ligne
    its.sort((a,b)=>a.y-b.y||a.x-b.x);
    const lignes=[];its.forEach(it=>{const l=lignes[lignes.length-1];
      if(l&&Math.abs(l.y-it.y)<2&&it.x<=l.x+l.w+8){l.w=Math.max(l.w,it.x+it.w-l.x)}else lignes.push({...it})});
    // cases à cocher ☐ (□ ❑ ❒ et la case Wingdings des PDF issus de Word)
    pg._cases=[];
    tc.items.forEach(it=>{const str=it.str||"";if(!/[☐□❑❒\uf06f\uf0a8\uf071]/.test(str))return;
      const fs=Math.hypot(it.transform[2],it.transform[3])||10,[x0,y0]=v.convertToViewportPoint(it.transform[4],it.transform[5]);
      [...str].forEach((c,i,arr)=>{if(!/[☐□❑❒\uf06f\uf0a8\uf071]/.test(c))return;
        const x=x0+it.width*(i/arr.length);
        pg._cases.push({x:x/v.width,y:(y0-fs*0.85)/v.height,s:fs*0.95/v.width})})});
    pg._zones=lignes.filter(l=>l.w>40).map(l=>({x:l.x/v.width,y:(l.y-v.width*0.026)/v.height,w:l.w/v.width}));
  }catch(e){}
}
function peCoche(p,c){return PE.notes.findIndex(n=>n.c&&n.p===p&&Math.abs(n.x-c.x)<0.006&&Math.abs(n.y-c.y)<0.006)}
function peOccupee(p,z){return PE.notes.some(n=>!n.c&&!n.form&&n.p===p&&Math.abs(n.y-z.y)<0.012&&n.x<z.x+z.w&&n.x+(n.w||0.4)>z.x)}
function peEcrireZone(pg,zi){const z=pg._zones[zi];if(!z)return;
  PE.notes.push({p:+pg.dataset.p,x:z.x,y:z.y,w:Math.min(z.w,1-z.x-0.01),fs:0.017,t:""});
  peCalque(pg);const tas=pg.querySelectorAll(".pe-note textarea"),ta=tas[tas.length-1];ta.focus();ta.scrollIntoView({block:"center",behavior:"smooth"});
}

async function peTelecharger(){
  if(!PE.buf)return;
  try{
    if(!window.PDFLib)await chargerScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js");
    const {PDFDocument,StandardFonts,rgb}=window.PDFLib;
    const doc=await PDFDocument.load(PE.buf.slice(0),{ignoreEncryption:true}),font=await doc.embedFont(StandardFonts.Helvetica);
    const propre=t=>String(t).replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/ | /g," ")
      .split("").map(c=>{try{font.encodeText(c);return c}catch(e){return"?"}}).join("");
    const pages=doc.getPages();
    PE.notes.forEach(n=>{const pg=pages[n.p-1];if(!pg||!n.c)return;const {width:W,height:H}=pg.getSize(),sz=n.s*W;
      pg.drawText("X",{x:n.x*W+sz*0.18,y:H-n.y*H-sz*0.82,size:sz*0.9,font,color:rgb(0.05,0.1,0.35)})});
    PE.notes.forEach(n=>{const pg=pages[n.p-1];if(!pg||n.c||!String(n.t||"").trim())return;
      const {width:W,height:H}=pg.getSize(),fs=(n.fs||0.017)*W,maxW=(n.w||0.4)*W-6,lh=fs*1.25;
      let y=H-n.y*H-fs-5;const x=n.x*W+4;
      propre(n.t).split("\n").forEach(par=>{let ligne="";
        par.split(" ").forEach(m=>{const essai=ligne?ligne+" "+m:m;
          if(font.widthOfTextAtSize(essai,fs)>maxW&&ligne){pg.drawText(ligne,{x,y,size:fs,font,color:rgb(0.05,0.1,0.35)});y-=lh;ligne=m}else ligne=essai});
        pg.drawText(ligne,{x,y,size:fs,font,color:rgb(0.05,0.1,0.35)});y-=lh});
    });
    const blob=new Blob([await doc.save()],{type:"application/pdf"}),u=URL.createObjectURL(blob);
    const a=UI.open&&find(UI.open);let info=null;Object.values(PDFS).forEach(l=>l.forEach(x=>{if(x.id===PE.id)info=x}));
    const lien=document.createElement("a");lien.href=u;lien.download=(info?PDF_LIB[info.type]+" "+info.annee:"Entretien")+(a?" - "+a.nom:"")+".pdf";
    document.body.appendChild(lien);lien.click();lien.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){toast("Téléchargement impossible : "+e.message)}
}

<p>A ce jour, et sauf erreur de notre part, il manque encore les documents listés ci-dessous.</p>
<p>Aussi, je vous remercie de bien vouloir transmettre le plus rapidement possible, les documents suivants :</p>
<ul>${l.map(([,t],i)=>`<li>${t}${i<l.length-1?" ;":"."}</li>`).join("")}</ul>
<p>Je reste à votre disposition pour toute question ou précision complémentaire.</p>
<p>Dans l'attente de notre rencontre.<br>Bien cordialement,</p>`}
function ouvrirMail(id){const a=find(id)||find(+id)||find(String(id));if(!a)return;
  const l=docsMail(a);
  let el=document.getElementById("rdvPanel");
  if(!el){el=document.createElement("div");el.id="rdvPanel";el.className="rdv-ov";document.body.appendChild(el)}
  el.innerHTML=`<div class="rdv-box mail-box" role="dialog" aria-modal="true" aria-label="Mail de relance">
    <div class="rdv-h"><h3>${ICO_MAIL} Mail de relance – ${esc(a.nom)}</h3><button class="btn light" data-rdvclose>Fermer</button></div>
    <div class="mail-f">
      ${l.length?"":`<p class="mail-warn">✅ Aucun document ne manque dans le dossier de ${esc(prenomDe(a.nom))}. Vous pouvez quand même écrire un message.</p>`}
      <label>À<input type="email" id="mlA" value="${esc(a.email||"")}" placeholder="adresse mail du salarié"></label>
      ${a.email?"":`<p class="mail-warn">⚠️ Aucune adresse mail dans la fiche : saisissez-la ci-dessus (ou récupérez-la avec « Emails Ximi »).</p>`}
      <label>Objet<input id="mlS" value="AID'AUX - Votre dossier salarié"></label>
      <label>Message <small>(modifiable : cliquez dans le texte)</small></label>
      <div id="mlB" class="mail-corps" contenteditable="true">${corpsMail(a)}</div>
      <p class="note rel-aide">Envoyé via Brevo · copie à la RH · l’envoi est noté dans le Journal Ximi du salarié, dans « Suivi des relances » et dans « Mails envoyés ». Les réponses du salarié arriveront dans votre boîte mail.</p>
      <div class="mail-pied"><button class="btn light" data-rdvclose>Annuler</button><button class="btn teal" id="mlGo" data-mlid="${a.id}">${ICO_MAIL} Envoyer</button></div>
    </div></div>`;
  el.hidden=false;document.body.classList.add("fm-open")}
async function envoyerMail(btn){const a=find(btn.dataset.mlid)||find(+btn.dataset.mlid);if(!a)return;
  const dest=document.getElementById("mlA").value.trim(),sujet=document.getElementById("mlS").value.trim(),B=document.getElementById("mlB");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dest)){toast("Indiquez une adresse mail valide");return}
  const html=`<div style="font-family:Verdana,Arial,sans-serif;font-size:14px;color:#222">${B.innerHTML}</div>`;
  const texte=B.innerText.trim();const docs=docsMail(a).map(([k])=>(Object.fromEntries([...DOCS_OBL,...DOCS_SIGN,...CLASSEUR]))[k]||k);
  if(!confirm("Envoyer ce mail à "+dest+" ?"))return;
  btn.disabled=true;btn.textContent="⏳ Envoi…";
  try{const j=await api("/api/salaries/"+a.id+"/mail-relance",{method:"POST",body:JSON.stringify({a:dest,sujet,html,texte,docs})});
    if(!a.email){a.email=dest}
    a.vie.relances.push({d:iso(new Date()),t:"mail",c:"Mail de relance envoyé (documents manquants)"+(docs.length?" : "+docs.join(", "):"")});
    push(a);fermerRdv();render();
    toast("Mail envoyé à "+prenomDe(a.nom)+(j.ximi?" · noté dans le Journal Ximi":" · pas noté dans Ximi ("+(j.ximi_msg||"erreur")+")"))}
  catch(e){if(e.message!=="login")toast(e.message);btn.disabled=false;btn.innerHTML=ICO_MAIL+" Envoyer"}}
document.addEventListener("click",ev=>{const t=ev.target.closest&&ev.target.closest("[data-mailrel],#mlGo");if(!t)return;ev.stopPropagation();
  if(t.id==="mlGo")envoyerMail(t);else ouvrirMail(t.dataset.mailrel)},true);
render();load();
</script>
